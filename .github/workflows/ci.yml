name: ci
on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      # Public repo: every action pinned to a commit SHA, looked up with
      # `gh api repos/<owner>/<repo>/commits/<tag>`; the tag stays in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 3.4.0
          ./tools/run-tests.ps1
  # The interface (ui-src): until 2026-11-15 nothing here ran its typecheck, its tests or its build,
  # so a green run said nothing about it (code review 2026-11-15).
  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui-src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-src/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # ui/ is committed and shipped: it must be what this source builds.
      - name: The committed ui/ matches a fresh build
        shell: bash
        run: |
          cd ..
          if [ -n "$(git status --porcelain -- ui)" ]; then
            echo "ui/ differs from a fresh build of ui-src: run npm run build and commit ui/."
            git status --porcelain -- ui
            exit 1
          fi
